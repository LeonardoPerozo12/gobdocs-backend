name: CI - GobDocs Backend

on:
  push:
    branches:
      - dev
      - main
  pull_request:
    branches:
      - dev
      - main

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Use Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      # Opcional: si tienes lint
      - name: Lint
        run: npm run lint --if-present

      # Opcional: si ya tienes tests
      - name: Run tests
        run: npm test --if-present

      - name: Build
        run: npm run build
